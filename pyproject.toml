[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-trading-agent-backtest"
version = "0.1.0"
description = "Historical research framework with deterministic causal execution"
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["yfinance>=1.7,<2", "exchange_calendars>=4.13,<5"]

[tool.setuptools.packages.find]
include = ["llm_trading*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -p no:cacheprovider"

